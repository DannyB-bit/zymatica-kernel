name: Zymatica Production Engine CI/CD & Verification Battery

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  multi-arch-build-and-test:
    name: Multi-Architecture Native Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Rust Clippy Verification
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Native Rust Workspace Tests
        run: cargo test --workspace --locked --verbose

      - name: Build Production Release Artifacts
        run: cargo build --workspace --release --locked

      - name: Build & Run C++20 Z-SPAR Tests (Ubuntu / macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S crates/zymatica-language-u/33_Z_SPAR_Semantic_Parity -B build_zspar -DCMAKE_BUILD_TYPE=Release
          cmake --build build_zspar -j
          ctest --test-dir build_zspar --output-on-failure

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run Master 4-Pillars Verification Suite
        run: |
          python crates/zymatica-language-u/unified_polyglot_pillars/unified_four_pillars_engine.py

      - name: Execute 8D Octonion Stress Harness (Class 32)
        run: |
          python crates/zymatica-language-u/32_8D_Octonion_Hypercube/run_proof.py

      - name: Execute Epigenetic Nullspace Continual Learning Proof (Class 31)
        run: |
          python crates/zymatica-language-u/31_Epigenetic_Weight_Crystallizer/run_proof.py

      - name: Execute Z-SPAR Golden Vector Cross-Validation (Class 33)
        run: |
          python crates/zymatica-language-u/33_Z_SPAR_Semantic_Parity/tools/reference_vectors.py

      - name: Execute Z-WORMHOLE Cross-Model Latent Transfer Proof (Class 34)
        run: |
          python crates/zymatica-language-u/34_Z_WORMHOLE_Latent_Transfer/run_proof.py

      - name: Execute Z-MCTS Continuous Latent Reasoning Proof (Class 35)
        run: |
          python crates/zymatica-language-u/35_Z_MCTS_Latent_Reasoning/run_proof.py
