name: Zymatica Production Engine CI/CD & Verification Battery

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  multi-arch-build-and-test:
    name: Multi-Architecture Native Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Rust Clippy Verification
        run: cargo clippy --workspace --all-targets

      - name: Run Native Rust Workspace Tests
        run: cargo test --workspace --verbose

      - name: Build Production Release Artifacts
        run: cargo build --workspace --release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu || true

      - name: Run Master 4-Pillars Verification Suite
        run: |
          python crates/zymatica-language-u/unified_polyglot_pillars/unified_four_pillars_engine.py

      - name: Execute 8D Octonion Stress Harness
        run: |
          python crates/zymatica-language-u/32_8D_Octonion_Hypercube/run_proof.py

      - name: Execute Epigenetic Nullspace Continual Learning Proof
        run: |
          python crates/zymatica-language-u/31_Epigenetic_Weight_Crystallizer/run_proof.py

