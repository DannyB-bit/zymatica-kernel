user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Rate Limiting Configuration
    # limit_req_zone defines a shared memory zone 'zymatica_api_limit' (10MB size)
    # targeting client IP address, allowing 5 requests per second.
    limit_req_zone $binary_remote_addr zone=zymatica_api_limit:10m rate=5r/s;

    upstream zymatica_backend {
        server zymatica-engine:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Health endpoint - bypass rate-limiting and authentication
        location /healthz {
            proxy_pass http://zymatica_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # OpenAI Chat Completions API
        location /v1/chat/completions {
            # Apply rate limiting
            limit_req zone=zymatica_api_limit burst=10 nodelay;

            proxy_pass http://zymatica_backend/v1/chat/completions;
            proxy_http_version 1.1;
            
            # Setup headers for reverse-proxying
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;

            # Stream settings: disable buffering to support instant token streams
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }

        # OpenAI Legacy Completions API
        location /v1/completions {
            limit_req zone=zymatica_api_limit burst=10 nodelay;

            proxy_pass http://zymatica_backend/v1/completions;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }

        # Prometheus Metrics API (Internal only or restricted access)
        location /metrics {
            # In a real environment, you'd add:
            # allow 10.0.0.0/8;
            # deny all;
            proxy_pass http://zymatica_backend/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Catch-all
        location / {
            return 404 '{"error": "Endpoint not found"}';
        }
    }
}
