name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Zymatica — traces conversations, LLM calls, and tool usage. Opt-in via `zymatica plugins enable observability/langfuse` or `zymatica tools → Langfuse Observability`."
author: Zymatica.space
requires_env:
  - ZYMATICA_LANGFUSE_PUBLIC_KEY
  - ZYMATICA_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
