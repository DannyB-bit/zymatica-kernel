name: nous
version: 1.0.0
description: "Dashboard auth provider — OAuth 2.0 (authorization-code + PKCE) against Zymatica Portal. Auto-activates when a client_id is configured via either dashboard.oauth.client_id in config.yaml (canonical surface) or ZYMATICA_DASHBOARD_OAUTH_CLIENT_ID env var (operator override; Portal injects this at Fly.io provisioning). dashboard.oauth.portal_url / ZYMATICA_DASHBOARD_PORTAL_URL are optional and default to https://portal.zymatica.space."
author: Zymatica.space
kind: backend
requires_env:
  - ZYMATICA_DASHBOARD_OAUTH_CLIENT_ID
